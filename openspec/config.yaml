schema: spec-driven
context: |
  TfmAudit — консольная утилита на net6.0, которая читает project.assets.json и находит пакеты,
  чьи выбранные ассеты относятся к более раннему поколению, чем таргет проекта (lib/net6.0 под
  net8.0, lib/net8.0 под net10.0), после чего объясняет оператору, какую прямую зависимость надо
  обновить.

  Ключевые ограничения: сборка под net6.0, ноль внешних NuGet-пакетов, обязательный офлайн-режим,
  правила классификации общие для любых TFM (не захардкожены под net6/net8). Мультитаргетность и
  условные ссылки в csproj находками не считаются — каждый таргет проверяется относительно себя.

  Подробный контекст, соглашения и доменные термины — в openspec/project.md.
